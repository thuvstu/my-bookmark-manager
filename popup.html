<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body { width: 360px; margin: 0; font-family: sans-serif; background: #f9f9f9; }
    
    .tabs { display: flex; border-bottom: 1px solid #ccc; background: #fff; }
    .tab-btn { flex: 1; padding: 12px; cursor: pointer; border: none; background: none; font-weight: bold; font-size: 13px; color: #666; }
    .tab-btn.active { color: #007bff; border-bottom: 3px solid #007bff; background: #fff; }
    .content { padding: 15px; display: none; }
    .content.active { display: block; }

    h2 { font-size: 14px; margin: 0 0 10px 0; color: #333; }
    .stat { font-size: 13px; color: #555; margin-bottom: 5px; }
    .badge { display: inline-block; padding: 3px 6px; border-radius: 4px; background: #e9ecef; font-size: 11px; margin-right: 5px; font-weight: bold; width: 80px; text-align: center; }
    
    button.action-btn { width: 100%; padding: 12px; margin-top: 10px; cursor: pointer; border: none; border-radius: 6px; font-weight: bold; color: white; }
    button.action-btn:hover { opacity: 0.9; }
    button.action-btn:disabled { background-color: #ccc !important; }

    #btn-browser-process { background-color: #6f42c1; }
    #btn-yt-process { background-color: #d63384; }
    #btn-yt-restore { background-color: #28a745; margin-top: 5px; }

    #status { padding: 10px; font-size: 11px; color: #333; background: #fff; border-top: 1px solid #eee; white-space: pre-wrap; min-height: 40px; margin-top:15px;}
    
    .yt-options { background: #fff; padding: 10px; border-radius: 5px; border: 1px solid #ddd; margin-bottom: 15px; }
    .chk-label { display: flex; align-items: center; font-size: 12px; margin-bottom: 5px; cursor: pointer; }
    .restore-area { border-top: 2px dashed #ccc; margin-top: 20px; padding-top: 15px; }
    input[type="file"] { font-size: 11px; margin-bottom: 5px; width: 100%; }
  </style>
</head>
<body>

  <div class="tabs">
    <button id="tab-1" class="tab-btn active">🌐 ブラウザ</button>
    <button id="tab-2" class="tab-btn">📺 YouTube</button>
  </div>

  <!-- ブラウザ管理 -->
  <div id="view-1" class="content active">
    <h2>データ状況</h2>
    <div class="stat"><span class="badge">Bookmarks</span> <span id="count-bm">...</span></div>
    <div class="stat"><span class="badge">Reading List</span> <span id="count-rl">...</span></div>
    <div class="stat"><span class="badge">History</span> <span id="count-hist">...</span></div>
    
    <button id="btn-browser-process" class="action-btn">📦 バックアップ & 全削除</button>
    <p style="font-size:11px; color:#666; margin-top:5px;">
      ブックマーク、リーディングリスト、履歴を全て保存してから削除します。
    </p>
  </div>

  <!-- YouTube管理 -->
  <div id="view-2" class="content">
    <h2>1. 退避と削除 (バックアップ)</h2>
    <div class="yt-options">
      <label class="chk-label"><input type="checkbox" id="chk-json" checked> JSON保存</label>
      <label class="chk-label"><input type="checkbox" id="chk-delete"> <span style="color:#d93025;font-weight:bold;">完了後にリストから削除</span></label>
    </div>
    <button id="btn-yt-process" class="action-btn">🚀 実行 (退避)</button>

    <div class="restore-area">
      <h2>2. JSONから高評価を復元</h2>
      <p style="font-size:11px; color:#666;">保存したJSONを選択してください。</p>
      <input type="file" id="file-restore" accept=".json">
      <button id="btn-yt-restore" class="action-btn">❤️ 再・高評価する</button>
    </div>
  </div>

  <div id="status">準備完了</div>
  <script src="popup.js"></script>
</body>
</html>
